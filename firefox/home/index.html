<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #ccc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
      padding: 2rem;
    }
    ul {
      list-style: none;
      display: flex;
      flex-direction: row;
      gap: 1rem;
    }
    a {
      color: #7eb8f7;
      text-decoration: none;
      font-size: 1.25rem;
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border: 1px solid #333;
      border-radius: 8px;
    }
    a:hover { text-decoration: underline; }
    img {
      max-width: 90vw;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="https://github.com/greenmushrooms">github</a></li>
    <li><a href="https://music.youtube.com">yt music</a></li>
  </ul>
  <img src="https://raw.githubusercontent.com/qutebrowser/qutebrowser/main/doc/img/cheatsheet-big.png" alt="cheatsheet">
</body>
</html>
