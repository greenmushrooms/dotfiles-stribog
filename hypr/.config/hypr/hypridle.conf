# hypridle: dim, lock, screen off, suspend.
# Lock now: loginctl lock-session (bound to SUPER+CTRL+L in hyprland.lua).
# On wake / screen on, lock-screen face tries face unlock (surface-face/).

general {
    lock_cmd         = $HOME/.local/bin/lock-screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; $HOME/.local/bin/lock-screen face
}

# 2.5 min: dim the screen to half (auto-brightness holds off meanwhile)
listener {
    timeout    = 150
    on-timeout = $HOME/.local/bin/auto-brightness pause; brightnessctl -s set "$(( $(brightnessctl -m | cut -d, -f4 | tr -d %) / 2 ))%"
    on-resume  = brightnessctl -r; $HOME/.local/bin/auto-brightness resume
}

# 5 min: lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; $HOME/.local/bin/lock-screen face
}

# 15 min: suspend
listener {
    timeout    = 900
    on-timeout = systemctl suspend
}
