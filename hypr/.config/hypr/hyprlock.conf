# hyprlock: blurred screenshot, clock, password field.

general {
    hide_cursor        = true
    ignore_empty_input = true
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.6
}

# Clock
label {
    monitor   =
    text      = $TIME
    color     = rgba(ffffffee)
    font_size = 96
    position  = 0, 160
    halign    = center
    valign    = center
}

# Date
label {
    monitor   =
    text      = cmd[update:60000] date +"%A, %d %B"
    color     = rgba(ffffffcc)
    font_size = 22
    position  = 0, 60
    halign    = center
    valign    = center
}

input-field {
    monitor           =
    size              = 320, 56
    outline_thickness = 2
    outer_color       = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color       = rgba(1a1a1aee)
    font_color        = rgba(ffffffff)
    check_color       = rgba(00ff99ee)
    fail_color        = rgba(ff5555ee)
    placeholder_text  = password
    fade_on_empty     = false
    rounding          = 0
    position          = 0, -60
    halign            = center
    valign            = center
}
